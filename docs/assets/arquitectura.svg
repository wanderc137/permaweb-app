<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitectura prevista de Permaweb App</title>
  <desc id="desc">Diagrama de bloques: navegador, aplicación Next.js con páginas y route handlers, capa de dominio, PostgreSQL, bundler Irys o Turbo, gateway Arweave y wallet operativa.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#0e1730"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223f"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7ba8"/>
    </marker>
    <marker id="flechaCian" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="flechaVioleta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1100" height="700" fill="url(#bg)"/>

  <!-- retícula decorativa -->
  <g stroke="#16223f" stroke-width="1" opacity="0.55">
    <path d="M0 120 H1100 M0 300 H1100 M0 500 H1100 M0 640 H1100"/>
    <path d="M120 0 V700 M400 0 V700 M760 0 V700 M980 0 V700"/>
  </g>

  <text x="48" y="52" fill="#e6edf7" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Permaweb App · arquitectura prevista</text>
  <text x="48" y="78" fill="#93a4c3" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">Monolito modular sobre Next.js App Router. Ningún componente está implementado todavía.</text>

  <!-- CLIENTE -->
  <g filter="url(#sombra)">
    <rect x="48" y="112" width="250" height="150" rx="12" fill="#111a33" stroke="#2a3a5f"/>
  </g>
  <text x="68" y="140" fill="#22d3ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">CLIENTE</text>
  <text x="68" y="170" fill="#e6edf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Navegador</text>
  <text x="68" y="192" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Páginas RSC + formularios</text>
  <text x="68" y="210" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Visor, historial y panel admin</text>
  <text x="68" y="236" fill="#7f90ae" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">HTTPS · cookies httpOnly</text>

  <!-- QR -->
  <g filter="url(#sombra)">
    <rect x="48" y="282" width="250" height="92" rx="12" fill="#111a33" stroke="#2a3a5f"/>
  </g>
  <text x="68" y="310" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">CANAL IMPRESO</text>
  <text x="68" y="334" fill="#e6edf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Código QR</text>
  <text x="68" y="354" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Apunta a /f/&lt;slug&gt; · PNG o SVG</text>

  <!-- APP -->
  <g filter="url(#sombra)">
    <rect x="356" y="112" width="404" height="262" rx="14" fill="url(#app)" stroke="#2f4a78" stroke-width="1.5"/>
  </g>
  <text x="378" y="140" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">APLICACIÓN · NEXT.JS</text>
  <text x="378" y="166" fill="#e6edf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">app/ · Server Components + Route Handlers</text>

  <rect x="378" y="182" width="360" height="54" rx="8" fill="#0d1529" stroke="#26375a"/>
  <text x="392" y="203" fill="#22d3ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Páginas</text>
  <text x="392" y="223" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">/f/[slug] · /v/[slug] · /historial · /admin/usuarios/[id]</text>

  <rect x="378" y="246" width="360" height="54" rx="8" fill="#0d1529" stroke="#26375a"/>
  <text x="392" y="267" fill="#22d3ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Route Handlers · /api</text>
  <text x="392" y="287" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">quote · upload · download · qr · auth · me · admin</text>

  <rect x="378" y="310" width="360" height="50" rx="8" fill="#161033" stroke="#4c3a86"/>
  <text x="392" y="331" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Dominio · lib/</text>
  <text x="392" y="350" fill="#a99cc9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">cotización · créditos · slugs · validación · estados</text>

  <!-- SERVICIOS -->
  <g filter="url(#sombra)">
    <rect x="812" y="112" width="240" height="118" rx="12" fill="#111a33" stroke="#2a3a5f"/>
  </g>
  <text x="832" y="140" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">DATOS</text>
  <text x="832" y="166" fill="#e6edf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">PostgreSQL</text>
  <text x="832" y="188" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Usuarios, sesiones, quotes,</text>
  <text x="832" y="206" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">uploads, ledger y auditoría</text>

  <g filter="url(#sombra)">
    <rect x="812" y="256" width="240" height="118" rx="12" fill="#111a33" stroke="#2a3a5f"/>
  </g>
  <text x="832" y="284" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">ALMACENAMIENTO</text>
  <text x="832" y="310" fill="#e6edf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Bundler Irys / Turbo</text>
  <text x="832" y="332" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Firma y publicación de</text>
  <text x="832" y="350" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">transacciones en Arweave</text>

  <g filter="url(#sombra)">
    <rect x="812" y="400" width="240" height="100" rx="12" fill="#111a33" stroke="#2a3a5f"/>
  </g>
  <text x="832" y="428" fill="#22d3ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">LECTURA</text>
  <text x="832" y="454" fill="#e6edf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Gateway Arweave</text>
  <text x="832" y="476" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">GET /&lt;txid&gt; · contenido inmutable</text>

  <!-- WALLET -->
  <g filter="url(#sombra)">
    <rect x="356" y="400" width="404" height="100" rx="12" fill="#1a1226" stroke="#5b3f7a"/>
  </g>
  <text x="378" y="428" fill="#f0abfc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">SECRETO OPERATIVO</text>
  <text x="378" y="454" fill="#e6edf7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">Wallet JWK</text>
  <text x="378" y="476" fill="#b9a6cf" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Solo en gestor de secretos · nunca en el repositorio ni en logs</text>

  <!-- FLECHAS -->
  <line x1="298" y1="187" x2="348" y2="187" stroke="#22d3ee" stroke-width="2" marker-end="url(#flechaCian)"/>
  <text x="303" y="178" fill="#22d3ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">HTTPS</text>

  <line x1="298" y1="328" x2="348" y2="300" stroke="#5f7ba8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <text x="302" y="348" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">escaneo</text>

  <line x1="760" y1="171" x2="804" y2="171" stroke="#34d399" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="742" y="160" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">SQL</text>

  <line x1="760" y1="315" x2="804" y2="315" stroke="#fbbf24" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="742" y="304" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">firma</text>

  <line x1="932" y1="374" x2="932" y2="392" stroke="#22d3ee" stroke-width="2" marker-end="url(#flechaCian)"/>
  <text x="942" y="390" fill="#22d3ee" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">txid</text>

  <line x1="558" y1="374" x2="558" y2="392" stroke="#a78bfa" stroke-width="2" marker-end="url(#flechaVioleta)"/>
  <text x="568" y="390" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">desde lib/storage</text>

  <!-- nota de estado -->
  <g>
    <rect x="48" y="540" width="1004" height="118" rx="12" fill="#121a2e" stroke="#2a3a5f" stroke-dasharray="6 5"/>
    <text x="72" y="570" fill="#fbbf24" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700">ESTADO DEL REPOSITORIO</text>
    <text x="72" y="596" fill="#c8d4e8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Scaffold sin implementación: no hay package.json, layout, route handlers, esquema de base de datos ni pruebas.</text>
    <text x="72" y="618" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Este diagrama describe la arquitectura propuesta, inferida de las carpetas vacías y de los nombres de dependencias.</text>
    <text x="72" y="640" fill="#93a4c3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">El contenido publicado en Arweave es permanente e irreversible; los metadatos en PostgreSQL sí son mutables.</text>
  </g>

  <text x="48" y="686" fill="#5f7ba8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">docs/assets/arquitectura.svg · tema oscuro · sin dependencias externas</text>
</svg>
