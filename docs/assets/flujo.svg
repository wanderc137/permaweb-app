<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Flujo de publicación de PermaDrop">
  <defs>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8b93a0"/>
    </marker>
    <marker id="seqBrass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#b79a62"/>
    </marker>
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b79a62" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#b79a62" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="#090a0c"/>
  <text x="40" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f0ece2">Flujo de una publicación</text>
  <text x="40" y="64" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8b93a0">Cotización firmada, reserva atómica, envío a la red y confirmación. Sin estados inconsistentes.</text>

  <!-- Lifelines -->
  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5">
    <rect x="40" y="92" width="180" height="42" rx="9" fill="#111318" stroke="#2b2f37"/>
    <text x="130" y="118" text-anchor="middle" fill="#e6e8ec">Usuario</text>

    <rect x="260" y="92" width="180" height="42" rx="9" fill="#111318" stroke="#2b2f37"/>
    <text x="350" y="112" text-anchor="middle" fill="#e6e8ec">Interfaz</text>
    <text x="350" y="127" text-anchor="middle" fill="#6f7681" font-size="10">React 19</text>

    <rect x="500" y="92" width="180" height="42" rx="9" fill="#111318" stroke="#b79a62" stroke-opacity="0.6"/>
    <text x="590" y="112" text-anchor="middle" fill="#e6e8ec">API Routes</text>
    <text x="590" y="127" text-anchor="middle" fill="#6f7681" font-size="10">Next.js 16 · Node</text>

    <rect x="740" y="92" width="180" height="42" rx="9" fill="#111318" stroke="#2b2f37"/>
    <text x="830" y="118" text-anchor="middle" fill="#e6e8ec">PostgreSQL</text>

    <rect x="970" y="92" width="180" height="42" rx="9" fill="#111318" stroke="#2b2f37"/>
    <text x="1060" y="118" text-anchor="middle" fill="#e6e8ec">Arweave L1</text>
  </g>

  <g stroke="#252a32" stroke-width="1" stroke-dasharray="3 5">
    <line x1="130" y1="134" x2="130" y2="740"/>
    <line x1="350" y1="134" x2="350" y2="740"/>
    <line x1="590" y1="134" x2="590" y2="740"/>
    <line x1="830" y1="134" x2="830" y2="740"/>
    <line x1="1060" y1="134" x2="1060" y2="740"/>
  </g>

  <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5">
    <!-- 1 quote -->
    <line x1="350" y1="170" x2="578" y2="170" stroke="#8b93a0" stroke-width="1.5" marker-end="url(#seqArrow)"/>
    <text x="464" y="162" text-anchor="middle" fill="#c4c9d1">POST /api/quote · tamaño</text>

    <line x1="590" y1="205" x2="1048" y2="205" stroke="#8b93a0" stroke-width="1.5" marker-end="url(#seqArrow)"/>
    <text x="819" y="197" text-anchor="middle" fill="#c4c9d1">getPrice(bytes)</text>

    <line x1="1060" y1="233" x2="602" y2="233" stroke="#6f7681" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#seqArrow)"/>
    <text x="831" y="225" text-anchor="middle" fill="#8b93a0">fee en winston</text>

    <line x1="590" y1="268" x2="362" y2="268" stroke="#b79a62" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seqBrass)"/>
    <text x="476" y="260" text-anchor="middle" fill="#b79a62">costClp + token HMAC · 5 min</text>

    <!-- 2 upload -->
    <rect x="40" y="292" width="1120" height="1" fill="#1d2128"/>
    <text x="40" y="288" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6f7681" letter-spacing="1.5">RESERVA</text>

    <line x1="350" y1="322" x2="578" y2="322" stroke="#8b93a0" stroke-width="1.5" marker-end="url(#seqArrow)"/>
    <text x="464" y="314" text-anchor="middle" fill="#c4c9d1">POST /api/upload · archivo + token</text>

    <line x1="590" y1="357" x2="818" y2="357" stroke="#b79a62" stroke-width="1.5" marker-end="url(#seqBrass)"/>
    <text x="704" y="349" text-anchor="middle" fill="#b79a62">BEGIN · FOR UPDATE · débito</text>

    <line x1="590" y1="392" x2="818" y2="392" stroke="#b79a62" stroke-width="1.5" marker-end="url(#seqBrass)"/>
    <text x="704" y="384" text-anchor="middle" fill="#b79a62">INSERT upload + ledger</text>

    <line x1="830" y1="427" x2="602" y2="427" stroke="#6f7681" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#seqArrow)"/>
    <text x="716" y="419" text-anchor="middle" fill="#8b93a0">COMMIT · saldo reservado</text>

    <!-- 3 publish -->
    <rect x="40" y="452" width="1120" height="1" fill="#1d2128"/>
    <text x="40" y="448" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6f7681" letter-spacing="1.5">PUBLICACIÓN</text>

    <line x1="590" y1="482" x2="1048" y2="482" stroke="#8b93a0" stroke-width="1.5" marker-end="url(#seqArrow)"/>
    <text x="819" y="474" text-anchor="middle" fill="#c4c9d1">firma JWK + POST /tx</text>

    <line x1="1060" y1="517" x2="602" y2="517" stroke="#6f7681" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#seqArrow)"/>
    <text x="831" y="509" text-anchor="middle" fill="#8b93a0">txid · o resultado ambiguo</text>

    <line x1="590" y1="552" x2="818" y2="552" stroke="#b79a62" stroke-width="1.5" marker-end="url(#seqBrass)"/>
    <text x="704" y="544" text-anchor="middle" fill="#b79a62">UPDATE txid · status = pending</text>

    <!-- 4 confirmation -->
    <rect x="40" y="577" width="1120" height="1" fill="#1d2128"/>
    <text x="40" y="573" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#6f7681" letter-spacing="1.5">CONFIRMACIÓN</text>

    <line x1="350" y1="607" x2="578" y2="607" stroke="#8b93a0" stroke-width="1.5" marker-end="url(#seqArrow)"/>
    <text x="464" y="599" text-anchor="middle" fill="#c4c9d1">GET /api/me · polling</text>

    <line x1="590" y1="642" x2="818" y2="642" stroke="#b79a62" stroke-width="1.5" marker-end="url(#seqBrass)"/>
    <text x="704" y="634" text-anchor="middle" fill="#b79a62">consulta estado / bloque</text>

    <line x1="590" y1="685" x2="362" y2="685" stroke="#b79a62" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#seqBrass)"/>
    <text x="476" y="677" text-anchor="middle" fill="#b79a62">confirmado · /f/slug · QR</text>
  </g>

  <!-- notes -->
  <rect x="40" y="726" width="1112" height="34" rx="8" fill="#b79a62" fill-opacity="0.06" stroke="#b79a62" stroke-opacity="0.22"/>
  <text x="56" y="747" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#b9bec7">Fallo definitivo → devolución automática y estado failed. Resultado ambiguo → se conserva el txid, no se devuelve y un administrador resuelve de forma idempotente.</text>

  <rect x="40" y="776" width="1112" height="20" fill="url(#fadeDown)" opacity="0"/>
</svg>
